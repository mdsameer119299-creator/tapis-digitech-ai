name: TAPIS DIGITECH project perspectives and social icons

on:
  push:
    branches: [seo-responsive-lead-gen-2026-08]

permissions:
  contents: write

jobs:
  corrective:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore premium project perspectives and social icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start = text.find('<!-- ===================== PROJECT PERSPECTIVES ===================== -->')
          end = text.find('<!-- ===================== FAQ ===================== -->', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not safely locate project perspectives section')

          section = '''<!-- ===================== PROJECT PERSPECTIVES ===================== -->
          <section class="tdx-sec alt" id="tdx-project-perspectives" aria-labelledby="tdx-projects-h">
            <div class="wrap">
              <div class="tdx-head reveal">
                <span class="kick">Selected projects &amp; perspectives</span>
                <h2 id="tdx-projects-h">Built for teams that mean business</h2>
                <p>Real platforms and digital transformation work across our business, employment, social-impact and brand ecosystem.</p>
              </div>
              <div class="tdx-tst">
                <article class="tdx-tcard2 reveal">
                  <span class="kick">B2B Digital Transformation</span>
                  <h3>TAPIS Global International</h3>
                  <p class="q">A premium B2B digital experience built around manufacturing capabilities, export positioning and a stronger buyer journey for a global carpet and rugs business.</p>
                  <div class="who"><span class="av">TG</span><span><b>Project Leadership Team</b><span>TAPIS Global International</span></span></div>
                </article>
                <article class="tdx-tcard2 reveal" style="--d:80ms">
                  <span class="kick">Employment Platform</span>
                  <h3>Noble Job</h3>
                  <p class="q">An employment platform bringing job discovery, employer recruitment and candidate opportunities together with a scalable digital foundation, including AI-powered recruitment capabilities.</p>
                  <div class="who"><span class="av">NJ</span><span><b>Project Leadership Team</b><span>Noble Job</span></span></div>
                </article>
                <article class="tdx-tcard2 reveal" style="--d:160ms">
                  <span class="kick">Social Impact</span>
                  <h3>NCCF</h3>
                  <p class="q">A digital foundation designed to connect people with volunteering, community initiatives, learning opportunities and practical ways to contribute to meaningful social impact.</p>
                  <div class="who"><span class="av">NC</span><span><b>Project Leadership Team</b><span>NCCF</span></span></div>
                </article>
                <article class="tdx-tcard2 reveal" style="--d:240ms">
                  <span class="kick">Digital Brand Experience</span>
                  <h3>TAPIS KASA</h3>
                  <p class="q">A modern digital experience being built around discovery, trust and a stronger customer journey for the next generation of the TAPIS KASA brand.</p>
                  <div class="who"><span class="av">TK</span><span><b>Project Leadership Team</b><span>TAPIS KASA</span></span></div>
                </article>
              </div>
              <p class="tdx-tst-note">Selected project perspectives are summaries of work and project direction. They are not fabricated third-party review ratings or attributed customer quotations.</p>
            </div>
          </section>

          '''
          text = text[:start] + section + text[end:]

          # Keep the social-media icon row visible. Do not invent social-profile URLs.
          # Icons remain present and accessible; real profile destinations can be added later.
          social_marker = '<div class="socials">'
          s = text.find(social_marker)
          if s == -1:
              raise SystemExit('Could not locate social icon container')
          e = text.find('</div>', s)
          if e == -1:
              raise SystemExit('Could not close social icon container')
          icons = '''<div class="socials" aria-label="TAPIS DIGITECH social media">
            <span title="Facebook"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i><span class="sr-only">Facebook</span></span>
            <span title="LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i><span class="sr-only">LinkedIn</span></span>
            <span title="X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i><span class="sr-only">X</span></span>
            <span title="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i><span class="sr-only">Instagram</span></span>
            <span title="YouTube"><i class="fa-brands fa-youtube" aria-hidden="true"></i><span class="sr-only">YouTube</span></span>
          '''
          text = text[:s] + icons + text[e+len('</div>'):]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          grep -q 'TAPIS Global International' index.html
          grep -q 'Noble Job' index.html
          grep -q 'NCCF' index.html
          grep -q 'TAPIS KASA' index.html
          grep -q 'fa-facebook-f' index.html
          grep -q 'fa-linkedin-in' index.html
          grep -q 'fa-instagram' index.html
          grep -q 'fa-youtube' index.html
          ! grep -q 'Trusted to build, ship and scale' index.html
          ! grep -q 'href="#"' index.html
          git rm .github/workflows/tapis-project-social-corrective.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'SEO: restore project perspectives and social icons [skip ci]'
          git push