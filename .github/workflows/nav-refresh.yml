name: TAPIS DIGITECH navigation refresh
on:
  push:
    branches: [feature/client-first-navigation]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh navigation across static pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          skip={'.git','.github','__pycache__'}
          service='''<div class="dropdown"><a href="ai-agent-automation.html"><i class="fa-solid fa-robot" aria-hidden="true"></i>AI Agents &amp; Automation</a><a href="whatsapp-ai-automation.html"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i>AI Chatbots &amp; WhatsApp</a><a href="software-development.html"><i class="fa-solid fa-code" aria-hidden="true"></i>Websites, Apps &amp; SaaS</a><a href="data-business-intelligence.html"><i class="fa-solid fa-chart-line" aria-hidden="true"></i>Data &amp; Business Intelligence</a><a href="digital-marketing.html"><i class="fa-solid fa-magnifying-glass-chart" aria-hidden="true"></i>AI Search, GEO &amp; Digital Growth</a><a href="cybersecurity-ai-security.html"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i>Cybersecurity &amp; AI Security</a><a href="cloud-it.html"><i class="fa-solid fa-cloud" aria-hidden="true"></i>Cloud &amp; DevOps</a><a href="branding-design.html"><i class="fa-solid fa-pen-nib" aria-hidden="true"></i>Brand &amp; Digital Experience</a></div>'''
          lab='''<div class="dropdown"><a href="free-tools/"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>Free Digital Growth Tools <span style="margin-left:auto;font-size:.68em;font-weight:700;opacity:.8">LAB</span></a><a href="free-tools/website-seo-audit/"><i class="fa-solid fa-chart-line" aria-hidden="true"></i>Website SEO Audit <span style="margin-left:auto;font-size:.68em;font-weight:700;opacity:.8">LIVE</span></a><a href="free-tools/"><i class="fa-solid fa-gauge-high" aria-hidden="true"></i>Website Health &amp; Performance</a><a href="free-tools/"><i class="fa-solid fa-robot" aria-hidden="true"></i>AI Readiness &amp; GEO</a><a href="free-tools/"><i class="fa-solid fa-bullseye" aria-hidden="true"></i>Conversion &amp; Growth Audits</a><a href="free-tools/"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>Explore All Tools</a></div>'''
          desktop='<ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="about.html">About Us</a></li><li class="has-drop"><a href="services.html">Services <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></a>'+service+'</li><li><a href="industries.html">Industries</a></li><li class="has-drop"><a href="free-tools/">TAPIS DIGITECH LAB <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></a>'+lab+'</li><li class="has-drop"><a href="resources.html">Resources <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></a><div class="dropdown"><a href="blog/index.html"><i class="fa-solid fa-newspaper" aria-hidden="true"></i>Blog &amp; Articles</a><a href="resources.html#guides"><i class="fa-solid fa-book-open" aria-hidden="true"></i>Guides &amp; Ebooks</a><a href="resources.html#webinars"><i class="fa-solid fa-video" aria-hidden="true"></i>Webinars</a><a href="resources.html#faq"><i class="fa-solid fa-circle-question" aria-hidden="true"></i>FAQs</a></div></li><li><a href="careers.html">Careers</a></li></ul>'
          mobile='<nav class="mobile-menu" id="mobileMenu" aria-label="Mobile"><a href="index.html">Home</a><a href="about.html">About Us</a><a href="services.html">Services</a><a href="industries.html">Industries</a><a href="free-tools/">TAPIS DIGITECH LAB</a><a href="resources.html">Resources</a><a href="careers.html">Careers</a><a href="contact.html" class="btn btn-primary">Contact Us</a></nav>'
          hrefs=['index.html','about.html','services.html','industries.html','free-tools/','free-tools/website-seo-audit/','resources.html','blog/index.html','careers.html','contact.html','ai-agent-automation.html','whatsapp-ai-automation.html','software-development.html','data-business-intelligence.html','digital-marketing.html','cybersecurity-ai-security.html','cloud-it.html','branding-design.html']
          changed=[]
          for p in root.rglob('*.html'):
            if any(x in skip for x in p.parts): continue
            t=p.read_text(encoding='utf-8'); old=t; prefix='../'*(len(p.relative_to(root).parts)-1)
            d=desktop
            for h in hrefs: d=d.replace(f'href="{h}"',f'href="{prefix}{h}"')
            m=mobile
            for h in ['index.html','about.html','services.html','industries.html','free-tools/','resources.html','careers.html','contact.html']: m=m.replace(f'href="{h}"',f'href="{prefix}{h}"')
            t=re.sub(r'<ul class="nav-links">.*?</ul>',d,t,count=1,flags=re.S)
            t=re.sub(r'<nav class="mobile-menu" id="mobileMenu" aria-label="Mobile">.*?</nav>',m,t,count=1,flags=re.S)
            if t!=old: p.write_text(t,encoding='utf-8'); changed.append(str(p))
          print('Updated navigation in',len(changed),'HTML files')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/nav-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' '.github/workflows/nav-refresh.yml'
          git commit -m "feat: make navigation client-first and add TAPIS DIGITECH LAB"
          git push
