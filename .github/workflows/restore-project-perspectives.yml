name: TAPIS DIGITECH project perspectives

on:
  push:
    branches: [seo-responsive-lead-gen-2026-08]

permissions:
  contents: write

jobs:
  restore-project-perspectives:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project perspectives section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- ===================== FAQ ===================== -->'

          if 'id="tdx-project-perspectives"' in text:
              raise SystemExit('Project perspectives section already exists')
          if marker not in text:
              raise SystemExit('FAQ marker not found; refusing to edit index.html')

          section = r'''
          <!-- ===================== PROJECT PERSPECTIVES ===================== -->
          <section class="tdx-sec alt" id="tdx-project-perspectives" aria-labelledby="tdx-projects-h">
            <div class="wrap">
              <div class="tdx-head reveal">
                <span class="kick">Selected projects</span>
                <h2 id="tdx-projects-h">Built for teams that mean business</h2>
                <p>Real platforms and digital transformation work across our business, employment and social-impact ecosystem.</p>
              </div>
              <div class="tdx-tst">
                <article class="tdx-tcard2 reveal">
                  <span class="kick">B2B Digital Transformation</span>
                  <h3>TAPIS Global International</h3>
                  <p class="q">A premium B2B digital presence built around manufacturing capabilities, export positioning and a stronger buyer journey for a global carpet and rugs business.</p>
                  <div class="who"><span class="av">TG</span><span><b>Project Team</b><span>TAPIS Global International</span></span></div>
                </article>
                <article class="tdx-tcard2 reveal" style="--d:80ms">
                  <span class="kick">Employment Platform</span>
                  <h3>Noble Job</h3>
                  <p class="q">A structured employment platform bringing job discovery, employer recruitment and candidate opportunities together with a scalable digital foundation.</p>
                  <div class="who"><span class="av">NJ</span><span><b>Project Team</b><span>Noble Job</span></span></div>
                </article>
                <article class="tdx-tcard2 reveal" style="--d:160ms">
                  <span class="kick">Social Impact</span>
                  <h3>NCCF</h3>
                  <p class="q">A digital foundation designed to connect people with volunteering, community initiatives and opportunities to contribute to meaningful social impact.</p>
                  <div class="who"><span class="av">NC</span><span><b>Project Team</b><span>NCCF</span></span></div>
                </article>
                <article class="tdx-tcard2 reveal" style="--d:240ms">
                  <span class="kick">Digital Brand Experience</span>
                  <h3>TAPIS KASA</h3>
                  <p class="q">A modern digital experience focused on discovery, trust and a stronger customer journey as we build the next generation of the TAPIS KASA brand.</p>
                  <div class="who"><span class="av">TK</span><span><b>Project Team</b><span>TAPIS KASA</span></span></div>
                </article>
              </div>
              <p class="tdx-tst-note">Selected project perspectives are presented as project summaries, not third-party review ratings or attributed customer quotations.</p>
            </div>
          </section>
          '''

          text = text.replace(marker, section + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate, remove one-shot workflow and commit
        run: |
          grep -q 'id="tdx-project-perspectives"' index.html
          grep -q 'TAPIS Global International' index.html
          grep -q 'Noble Job' index.html
          grep -q 'NCCF' index.html
          grep -q 'TAPIS KASA' index.html
          ! grep -q 'Trusted to build, ship and scale' index.html
          ! grep -q 'aria-label="5 out of 5"' index.html
          git rm .github/workflows/restore-project-perspectives.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "SEO: add verified project perspective section [skip ci]"
          git push
